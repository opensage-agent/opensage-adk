# Zero-Day Evaluation Config
# project_relative_dockerfile_path is resolved from the sageagent-ctf repo root
# where opensage commands are run.

DEFAULT_IMAGE = "kalilinux/kali-rolling"
TASK_NAME = "ctf_task"
ABSOLUTE_SHARED_DATA_PATH = ""
# Host directory mounted into the main sandbox at /mem/long_term so
# long-term knowledge survives container restarts. Override via the
# environment variable of the same name; empty disables the mount.
HOST_LONG_TERM_MEM_DIR = ""
GDB_PORT = 1111
IDA_PRO_MCP_PORT = 1112
PYGHIDRA_MCP_PORT = 1113
GHIDRA_MCP_PORT = 1114

task_name = "${TASK_NAME}"
src_dir_in_sandbox = "/shared/code"
default_host = ""

[sandbox]
backend = "native"
absolute_shared_data_path = "${ABSOLUTE_SHARED_DATA_PATH}"
mount_host_paths = [
    "${HOST_LONG_TERM_MEM_DIR}:/mem/long_term:rw",
]

[sandbox.sandboxes.main]
image = "${TASK_NAME}_main"
project_relative_dockerfile_path = "agent_library/agents/ctf_agent/main_sandbox/Dockerfile"
timeout = 600
mcp_services = ["ida_pro_mcp", "pyghidra_mcp", "ghidra_mcp"]
[sandbox.sandboxes.main.build_args]
BASE_IMAGE = "${DEFAULT_IMAGE}"
[sandbox.sandboxes.main.ports]
"8002/tcp" = "${IDA_PRO_MCP_PORT}"
"8003/tcp" = "${PYGHIDRA_MCP_PORT}"
"8004/tcp" = "${GHIDRA_MCP_PORT}"
[sandbox.sandboxes.main.extra]
initializer_timeout_sec = 1800

# GDB MCP sandbox configuration
[sandbox.sandboxes.gdb_mcp]
image = "${TASK_NAME}_gdb_mcp"
project_relative_dockerfile_path = "src/opensage/templates/dockerfiles/gdb_mcp/Dockerfile"
command = ""
mcp_services = ["gdb_mcp"]
[sandbox.sandboxes.gdb_mcp.build_args]
BASE_IMAGE = "${DEFAULT_IMAGE}"
[sandbox.sandboxes.gdb_mcp.ports]
"1111/tcp" = "${GDB_PORT}"
[sandbox.sandboxes.gdb_mcp.extra]
initializer_timeout_sec = 1800

[llm]
[history]
max_tool_response_length = 20000

[history.events_compaction]
max_history_summary_length = 300000

[mcp]
# GDB MCP service configuration
[mcp.services.gdb_mcp]
sse_port = "${GDB_PORT}"

[mcp.services.ida_pro_mcp]
sse_port = "${IDA_PRO_MCP_PORT}"

[mcp.services.pyghidra_mcp]
sse_port = "${PYGHIDRA_MCP_PORT}"

[mcp.services.ghidra_mcp]
sse_port = "${GHIDRA_MCP_PORT}"

[plugins]
enabled = [
    "history_summarizer_plugin",
    "tool_response_summarizer_plugin",
    "image_injection_plugin",
]
