[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secagentx"
version = "0.1.0"
description = "Security Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "xyz", email = "xyz@abc.edu" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pandas==2.2.3",
    "neomodel==5.4.3",
    "docker==7.1.0",
    "python-dotenv==1.1.0",
    "tree-sitter-languages==1.10.2",
    "loguru==0.7.3",
    "pyyaml==6.0.2",
    "requests==2.32.4",
    "google-adk==1.5.0",
]

[project.urls]
Homepage = "https://github.com/ucsb-mlsec/SecAgentFramework"
Repository = "https://github.com/ucsb-mlsec/SecAgentFramework"
Issues = "https://github.com/ucsb-mlsec/SecAgentFramework/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/secagentx"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
]

[tool.hatch.version]
path = "src/secagentx/__init__.py"