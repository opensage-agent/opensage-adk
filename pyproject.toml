[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensage"
version = "0.1.0"
description = "OpenSage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pip",
    "google-adk<=1.25.1",
    "pandas==2.2.3",
    "docker==7.1.0",
    "python-dotenv>=1.1.0",
    "tree-sitter-language-pack==1.6.2",
    "pyyaml==6.0.2",
    "requests==2.32.4",
    "litellm>=1.74.7",
    "msgspec>=0.19.0",
    "websockets>=15.0.1",
    "networkx>=3.4.2",
    "toml>=0.10.2",
    "fire>=0.6.0",
    "jsonpickle>=3.0.0",
    "datasets>=2.0.0",
    "dacite>=1.8.0",
    "cxxfilt>=0.3.0",
    "click>=8.1.8,<9.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "python-magic>=0.4.27",
    "Pillow>=12.0.0",
]

[project.optional-dependencies]
langfuse = [
    "langfuse==3.11.1",
    "openinference-instrumentation-google-adk==0.1.8",
    "opentelemetry-api==1.37.0",
    "opentelemetry-sdk==1.37.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.37.0",
    "opentelemetry-exporter-otlp-proto-http==1.37.0"
]
cybergym = [
    "cybergym[dev,server] @ git+https://github.com/sunblaze-ucb/cybergym",
]
harbor = [
    # harbor CLI is used for downloading tasks (subprocess only, not imported).
    # Install separately if dependency conflicts arise: pip install "harbor>=0.3.0"
    "harbor>=0.3.0",
]
agentbeats = [
    # Required for the OpenSage × AgentBeats integration (evals/agentbeats/).
    # google-adk 1.25.1 uses the a2a-sdk 0.3.x API surface
    # (a2a.server.apps.A2AStarletteApplication etc.).  The 1.0.x series
    # changed the API completely; pin to 0.3.x for compatibility.
    "a2a-sdk>=0.3.26,<1.0.0",
    # `fastmcp` is used by AgentBeats' MCP server; needed if running the full
    # AgentBeats stack locally for end-to-end testing.
    "fastmcp>=2.0.0",
    # `httpx` is used by the launcher to poll agent readiness.
    "httpx>=0.27.0",
]
nitrobox = [
    "nitrobox @ git+https://github.com/opensage-agent/nitrobox.git@main",
]
opensandbox = [
    "opensandbox>=0.1.5",
]
full = [
    "opensage[langfuse,cybergym,harbor,agentbeats,nitrobox,opensandbox]",
]

[project.scripts]
opensage = "opensage.cli.opensage_cli:main"

[dependency-groups]
dev = [
    "pre-commit",
    "ipython",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff==0.15.9",
]
docs = [
    "zensical>=0.0.33",
]

[tool.uv]
override-dependencies = []
no-build-isolation-package = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "src/opensage",
    "examples",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opensage"]

[tool.ruff]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = [
    "I", # isort
    "F", # pyflakes
]
ignore = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["opensage", "tests"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "opensage/examples"
"src/opensage/cli/assets/opensage_favicon.ico" = "opensage/cli/assets/opensage_favicon.ico"
"src/opensage/cli/vendor/adk_browser" = "opensage/cli/vendor/adk_browser"
"src/opensage/plugins/default/claude_code_hooks" = "opensage/plugins/default/claude_code_hooks"

[tool.pytest.ini_options]
log_format = "%(asctime)s [%(name)s] [%(levelname)s] %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_level = "WARNING"
log_cli = false
timeout = 300
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
norecursedirs = ["tests/rl"]
markers = [
    "native_backend: tests for the native sandbox backend",
    "k8s_backend: tests for the Kubernetes sandbox backend",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
