name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
      - name: Install docs dependencies
        # Installs the opensage package itself (needed by the CLI reference
        # generator) along with zensical from the [docs] group.
        run: uv sync --group docs
      - name: Generate CLI reference pages
        # Zensical has no build-time hook system, so regenerate the pages
        # from live `opensage --help` output before building.
        run: uv run python docs/scripts/generate_cli_reference.py
      - name: Build docs site
        run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
