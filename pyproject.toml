[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigise"
version = "0.1.0"
description = "AIgiSE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.13.0",
    "cybergym[dev,server] @ git+https://github.com/sunblaze-ucb/cybergym",
    "pandas==2.2.3",
    "neomodel==5.4.3",
    "docker==7.1.0",
    "python-dotenv==1.1.0",
    "tree-sitter-languages==1.10.2",
    "loguru==0.7.3",
    "pyyaml==6.0.2",
    "requests==2.32.4",
    "google-adk==1.13.0",
    "litellm>=1.74.7",
    "msgspec>=0.19.0",
    "websockets>=15.0.1",
    "networkx>=3.4.2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ipython",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
override-dependencies = []
no-build-isolation-package = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = [
    "I", # isort
    "F", # pyflakes
]
ignore = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
