# AIgiSE config for sample_reward_func

task_name = "sample_reward_func_task"
src_dir_in_sandbox = "/shared/code"

[sandbox]
backend = "native"

[sandbox.sandboxes.main]
image = "ubuntu:20.04_main"
project_relative_dockerfile_path = "src/aigise/templates/dockerfiles/main/Dockerfile"
timeout = 300

[sandbox.sandboxes.main.build_args]
BASE_IMAGE = "ubuntu:20.04"

[llm]
[llm.model_configs.main]
model_name = "openai/o4-mini"
temperature = 0.2
max_tokens = 2048
