# Zensical configuration for the OpenSage-ADK docs site.
#
# Migrated from mkdocs.yml. Zensical (https://zensical.org) is the TOML-
# configured successor to Material for MkDocs from the same team. Notes:
#   - There is no `hooks` system yet, so CLI reference pages are generated
#     by `docs/scripts/generate_cli_reference.py` and must be regenerated
#     manually before `zensical build`.
#   - There is no `exclude_docs` yet; we currently have nothing to exclude.

[project]
site_name = "OpenSage-ADK"
site_description = "OpenSage-ADK Documentation"

# Documentation source directory and build output directory.
docs_dir = "docs/wiki"
site_dir = "site"

# Repository information (shown in the header).
repo_url = "https://github.com/opensage-agent/opensage-adk"
repo_name = "opensage-adk"

# copyright notice
copyright = "&copy; 2026 OpenSage"

# Custom styles (logo sizing, palette overrides, small UI tweaks).
extra_css = ["assets/stylesheets/extra.css"]
dev_addr = "localhost:11451"


