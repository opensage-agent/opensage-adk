# SecAgentFramework Default Configuration with Template Variables
# Template variables: ${VAR_NAME} will be expanded from top-level variables or environment

# Top-level template variables (UPPERCASE)
DEFAULT_IMAGE = "n132/arvo:51603-vul"
NEO4J_PASSWORD = "callgraphn4j!"
DEFAULT_HOST = "127.0.0.1"
MAIN_MODEL = "anthropic/claude-sonnet-4-20250514"
TASK_NAME = "test_cpg"

# History configuration defaults

task_name = "${TASK_NAME}"

[neo4j]
user = "neo4j"
password = "${NEO4J_PASSWORD}"
bolt_port = 7688
neo4j_http_port = 7475

[sandbox]
default_image = "${DEFAULT_IMAGE}"
backend = "native"
project_relative_shared_data_path = "tests/unit/data/arvo_51603_vul_code.tar.gz"

# Main sandbox configuration
[sandbox.sandboxes.main]
image = "${DEFAULT_IMAGE}"
timeout = 300

# CodeQL sandbox configuration
[sandbox.sandboxes.codeql]
image = "${DEFAULT_IMAGE}"
command = "tail -f /dev/null"

# Joern sandbox
[sandbox.sandboxes.joern]
image = "aigise/joern"
project_relative_dockerfile_path = "src/aigise/templates/dockerfiles/joern/Dockerfile"
command = ""
ports = { "8081/tcp" = 8081 }

# Neo4j sandbox configuration
[sandbox.sandboxes.neo4j]
image = "neo4j:5.26.12-enterprise"
command = "" # Use Neo4j's default startup command
[sandbox.sandboxes.neo4j.environment]
NEO4J_ACCEPT_LICENSE_AGREEMENT = "yes"
NEO4J_AUTH = "neo4j/${NEO4J_PASSWORD}"
NEO4J_PLUGINS = '["graph-data-science", "apoc"]'
NEO4J_server_directories_import = "/shared/neo4j/import"
NEO4J_apoc_import_file_enabled = "true"
NEO4J_apoc_export_file_enabled = "true"
[sandbox.sandboxes.neo4j.ports]
"7474/tcp" = 7475 # HTTP port (standard)
"7687/tcp" = 7687 # Bolt port (standard)

[build]
compile_command = "arvo compile"
