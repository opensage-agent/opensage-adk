site_name: SAGE-X Documentation
site_url: https://3rdn4Li.github.io/SAGE-X
site_description: SAGE-X Development Documentation

# Documentation directory (where markdown files are)
docs_dir: docs/wiki

# Repository information
repo_url: https://github.com/AIgiSE/AIgiSE  # Update with your repo URL
repo_name: AIgiSE/AIgiSE  # Update with your repo name

# Theme
theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation structure (maps to docs/wiki/ files)
nav:
  - Home: index.md
  - Getting Started:
    - Introduction: Introduction.md
    - Getting Started: Getting-Started.md
    - Project Structure: Project-Structure.md
  - Entry Points:
    - Overview: Entry-Points.md
    - OpenSage Web Entry: OpenSage-Web-Entry.md
    - Evaluation Entry: Evaluation-Entry.md
  - Architecture:
    - Architecture: Architecture.md
    - Core Components: Core-Components.md
    - Core Concepts: Core-Concepts.md
    - System Workflow (planned): System-Workflow.md
    - Memory System (planned): Memory-System.md
  - Development:
    - Development Guides: Development-Guides.md
    - Adding Tools: Adding-Tools.md
    - Adding Sandboxes: Adding-Sandboxes.md
    - Adding Evaluations: Adding-Evaluations.md
  - Practices:
    - Best Practices: Best-Practices.md
    - Common Patterns: Common-Patterns.md
    - Testing & Debugging: Testing-Debugging.md
  - Reference:
    - Configuration: Configuration.md
    - Troubleshooting: Troubleshooting.md
    - Contributing: Contributing.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AIgiSE/AIgiSE  # Update with your repo URL
